services:
  lucky-languages:
    build: .
    ports:
      - "8000:8000"
    environment:
      LUCKY_DB_PATH: /data/lucky.sqlite3
      LUCKY_OLLAMA_URL: http://ollama:11434/api/generate
      LUCKY_PEDAGOGY_MODEL: qwen2.5:1.5b
    volumes:
      - lucky-data:/data
    depends_on:
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - lucky-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: |
      until ollama list >/dev/null 2>&1; do sleep 2; done
      ollama pull qwen2.5:1.5b
    restart: "no"

volumes:
  lucky-data:
  lucky-models:
