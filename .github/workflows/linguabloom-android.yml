name: LinguaBloom Android APK

on:
  push:
    branches: ["feat/brand-download-resume-full-test"]
    paths:
      - "lucky-languages/android/**"
      - ".github/workflows/linguabloom-android.yml"
  pull_request:
    paths:
      - "lucky-languages/android/**"
      - ".github/workflows/linguabloom-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lucky-languages/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble installable debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.linguabloom.academy'" apk-badging.txt
          grep -q "versionName='1.0.0'" apk-badging.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaBloom-Academy-Android-1.0.0
          path: lucky-languages/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linguabloom-android-v1.0.0
          name: LinguaBloom Academy Android 1.0.0
          body: |
            LinguaBloom Academy Android wrapper, built and verified by GitHub Actions.
            Configure the URL of your running LinguaBloom Academy backend on first launch.
          files: lucky-languages/android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
