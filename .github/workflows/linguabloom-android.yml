name: LinguaBloom Android APK

on:
  push:
    branches: ["feat/brand-download-resume-full-test", "feat/offline-academy-android", "feat/linguabloom-local-ai-download-resume"]
    paths:
      - "lucky-languages/android/**"
      - ".github/workflows/linguabloom-android.yml"
  pull_request:
    paths:
      - "lucky-languages/android/**"
      - ".github/workflows/linguabloom-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lucky-languages/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Validate bundled offline course pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assets = Path("app/src/main/assets/offline")
          pack = json.loads((assets / "course-pack-v1.json").read_text(encoding="utf-8"))
          assert pack["offline_ready"] is True
          assert len(pack["languages"]) == 10, "Expected ten starter languages"
          ids = []
          for language in pack["languages"]:
              assert language["lessons"], f"No lessons for {language['code']}"
              for lesson in language["lessons"]:
                  ids.append(lesson["id"])
                  exercise = lesson["exercise"]
                  assert exercise["answer"] in exercise["choices"], lesson["id"]
          assert len(ids) == len(set(ids)), "Lesson IDs must be unique"
          page = (assets / "index.html").read_text(encoding="utf-8")
          assert "EMBEDDED_COURSE_PACK=" in page and "localStorage" in page
          assert "https://" not in page and "http://" not in page, "Offline page must not reference remote assets"
          print(f"Validated {len(ids)} offline starter lessons across {len(pack['languages'])} languages")
          PY
      - name: Validate local AI integration contract
        run: |
          grep -q "litertlm-android" app/build.gradle
          grep -q "class LocalTutor" app/src/main/java/com/linguabloom/academy/LocalTutor.kt
          grep -q "sendMessageAsync" app/src/main/java/com/linguabloom/academy/LocalTutor.kt
          grep -q "MODEL_SHA256" app/src/main/java/com/linguabloom/academy/MainActivity.java
          grep -q "Range" app/src/main/java/com/linguabloom/academy/MainActivity.java
          grep -q "window.AndroidTutor.ask" app/src/main/assets/offline/index.html
          grep -q "linguabloom-3d-globe.svg" app/src/main/assets/offline/index.html
          echo "Offline AI and 3D resource integration verified"
      - name: Assemble installable debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.linguabloom.academy'" apk-badging.txt
          grep -q "versionName='1.1.0'" apk-badging.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaBloom-Academy-Android-1.1.0
          path: lucky-languages/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/brand-download-resume-full-test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linguabloom-android-v1.1.0
          name: LinguaBloom Academy Android 1.1.0
          body: |
            LinguaBloom Academy Android with offline lessons and local AI tutor.
          files: lucky-languages/android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
