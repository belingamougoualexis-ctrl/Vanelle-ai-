name: Vanelle Hugging Face external smoke tests
on:
  push:
    branches: ["feat/vanelle-omnigrid-android"]
    paths:
      - ".github/workflows/huggingface-spaces-smoke.yml"
      - "omnigrid-android/**"
      - ".github/workflows/omnigrid-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-artifact-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact GGUF artifact used by the Android app
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf" \
            --output qwen2.5-0.5b-instruct-q4_0.gguf
          ls -lh qwen2.5-0.5b-instruct-q4_0.gguf
          echo "7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  qwen2.5-0.5b-instruct-q4_0.gguf" | sha256sum --check -
  public-space-translation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public Gradio Space API and run a real translation request
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          base = "https://abidlabs-en2fr.hf.space"
          def request(url, data=None, timeout=45):
              headers = {"User-Agent": "Vanelle-OmniGrid-SmokeTest/1.0"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers)
              return urllib.request.urlopen(req, timeout=timeout)

          # The public OpenAPI schema proves the Space exposes a callable Gradio API.
          with request(base + "/gradio_api/openapi.json", timeout=120) as response:
              schema = json.loads(response.read().decode("utf-8"))
              assert isinstance(schema, dict) and schema, "Space returned an empty OpenAPI schema"
              print("PASS: public Space API schema reachable")

          # Exercise actual inference, not just the landing page.
          payload = json.dumps({"data": ["Hello, how are you?"]}).encode("utf-8")
          with request(base + "/gradio_api/call/predict", payload, timeout=120) as response:
              submitted = json.loads(response.read().decode("utf-8"))
          event_id = submitted.get("event_id")
          assert event_id, f"Space did not return an event_id: {submitted!r}"
          with request(base + "/gradio_api/call/predict/" + event_id, timeout=180) as response:
              stream = response.read().decode("utf-8", errors="replace")
          assert "event: complete" in stream, f"Space inference did not complete: {stream[-1000:]}"
          assert "data:" in stream, f"Space returned no result data: {stream[-1000:]}"
          print("PASS: public Space completed a real translation inference request")
          print(stream[-1500:])
          PY
