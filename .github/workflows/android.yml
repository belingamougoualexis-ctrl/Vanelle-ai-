name: ProofRail Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "platform-tools" \
                     "emulator" \
                     "system-images;android-30;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Debug build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Instrumented tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Release build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | tee apk-badging.txt
          grep -q "package: name='com.proofrail.app' versionName='1.0.0'" apk-badging.txt
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: proofrail-1.0.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
