name: Vanelle Academy Android CI

on:
  push:
    branches: [ main, master ]
    paths:
      - "lucky-languages/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "lucky-languages/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lucky-languages/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle project
        run: gradle tasks --no-daemon --stacktrace

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | tee apk-badging.txt
          grep -q "package: name='com.vanelle.academy'" apk-badging.txt
          grep -q "versionName='1.0.0'" apk-badging.txt
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload installable Android APK (debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: vanelle-academy-1.0.0-debug-installable
          path: lucky-languages/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Vanelle Academy release APK
        uses: actions/upload-artifact@v4
        with:
          name: vanelle-academy-1.0.0-release-unsigned
          path: lucky-languages/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
