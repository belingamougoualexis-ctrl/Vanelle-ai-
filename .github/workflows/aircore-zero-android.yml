name: Vanelle AirCore Zero Android APK
on:
  push:
    branches: [main, feat/aircore-zero-isolated-integration]
    paths:
      - 'aircore-zero/**'
      - '.github/workflows/aircore-zero-android.yml'
  pull_request:
    paths:
      - 'aircore-zero/**'
      - '.github/workflows/aircore-zero-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: aircore-zero
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s aircore-zero/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vanelle-AirCore-Zero-debug-APK
          path: aircore-zero/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
