name: Lucky Languages Academy CI
on:
  push:
    branches: ["feat/lucky-languages-academy"]
    paths:
      - "lucky-languages/**"
      - ".github/workflows/lucky-languages-ci.yml"
  pull_request:
    paths:
      - "lucky-languages/**"
      - ".github/workflows/lucky-languages-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lucky-languages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lucky-languages/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q
