name: VANELLE OMNIGRID AI - local build and inference tests
on:
  push:
    branches: ["**"]
    paths:
      - "omnigrid-android/**"
      - "omnigrid-worker/**"
      - ".github/workflows/omnigrid-android.yml"
  pull_request:
    paths:
      - "omnigrid-android/**"
      - ".github/workflows/omnigrid-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test cross-platform worker allow-list and approvals
        working-directory: omnigrid-worker
        run: python -m unittest -v test_worker.py

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Run specialist-agent unit tests
        working-directory: omnigrid-android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        working-directory: omnigrid-android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Build release APK
        working-directory: omnigrid-android
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify APK files
        working-directory: omnigrid-android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vanelle-omnigrid-ai-debug-apk
          path: omnigrid-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: vanelle-omnigrid-ai-release-unsigned
          path: omnigrid-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
  local-model-emulator-test:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install ARM64 emulator image
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;arm64-v8a"
      - name: Boot ARM64 emulator, install model, and test real inference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          script: |
            cd omnigrid-android
            gradle --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            curl --fail --location --retry 3 --retry-delay 2 "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf" --output /tmp/qwen2.5-0.5b-instruct-q4_0.gguf
            echo "7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  /tmp/qwen2.5-0.5b-instruct-q4_0.gguf" | sha256sum --check -
            adb shell mkdir -p /sdcard/Android/data/ai.vanelle.omnigrid.debug/files/models
            adb push /tmp/qwen2.5-0.5b-instruct-q4_0.gguf /sdcard/Android/data/ai.vanelle.omnigrid.debug/files/models/qwen2.5-0.5b-instruct-q4_0.gguf
            gradle --no-daemon connectedDebugAndroidTest
